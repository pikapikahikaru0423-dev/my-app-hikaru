<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>舞台配置図 Pro v17.1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{display:flex;flex-direction:column;height:100vh;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:#d8d6cf;overflow:hidden;touch-action:none;}

/* Toolbar */
#toolbar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:5px 10px;background:white;border-bottom:1px solid #ddd;
  min-height:42px;flex-shrink:0;z-index:100;
}
.tb-group{display:flex;align-items:center;gap:4px;}
.tb-sep{width:1px;height:22px;background:#e0e0e0;margin:0 2px;}
.tb-label{font-size:10px;color:#999;white-space:nowrap;}

button{
  padding:6px 12px;font-size:11px;border:1px solid #ccc;border-radius:5px;
  background:white;cursor:pointer;color:#333;white-space:nowrap;
  transition:background .12s;
}
button:hover{background:#f0f0ee;}
button:disabled{opacity:0.3;cursor:default;}
button.active{background:#e1f5ee;border-color:#1d9e75;color:#0f6e56;font-weight:600;}

input[type=range]{width:80px;}
input[type=number]{width:48px;padding:3px 5px;font-size:11px;border:1px solid #ccc;border-radius:4px;}
input[type=color]{width:30px;height:24px;padding:0;border:none;background:none;cursor:pointer;}

/* Main structure */
#main{display:flex;flex:1;overflow:hidden;}

#sidebar{
  width:160px;min-width:160px;background:white;border-right:1px solid #ddd;
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
}
.tabs{display:flex;border-bottom:1px solid #eee;flex-shrink:0;}
.tab{flex:1;padding:10px 2px;text-align:center;border-bottom:2px solid transparent;cursor:pointer;font-size:11px;color:#888;}
.tab.active{border-color:#1d9e75;color:#1d9e75;font-weight:600;}
.inst-list{flex:1;overflow-y:auto;}
.inst{padding:8px 10px;font-size:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;align-items:center;gap:6px;}
.inst.active{background:#e1f5ee;}
.inst-dot{width:8px;height:8px;border-radius:50%;}

#canvas-wrap{flex:1;overflow:auto;background:#d8d6cf;position:relative;}
#zoom-container{transform-origin:top left;position:absolute;top:20px;left:20px;}
#stage{
  position:relative;background:white;border:1px solid #aaa;
  box-shadow:0 2px 16px rgba(0,0,0,.18);overflow:visible;touch-action:none;
}
.stage-grid{position:absolute;inset:0;pointer-events:none;z-index:2;
  background-image:linear-gradient(rgba(0,0,0,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.05) 1px,transparent 1px);
  background-size:30px 30px;}
#svg-layer{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:3;}

/* Elements */
.elem{position:absolute;cursor:move;user-select:none;touch-action:none;z-index:10;pointer-events:auto;}
.chair{
  border-radius:50%;border:2px solid;background:white;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;position:relative;width:100%;height:100%;
}
.chair-text{position:absolute;white-space:nowrap;pointer-events:none;text-align:center;}
.elem.selected{outline:2px solid #1d9e75;outline-offset:4px;}

.label-elem{font-size:14px;background:white;padding:4px 8px;border:1px solid #aaa;border-radius:3px;display:flex;align-items:center;justify-content:center;text-align:center;}
.rect-elem{border:2px solid #555;background:rgba(200,200,200,0.1);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;overflow:hidden;}

/* Group highlight */
.elem.grouped-member{box-shadow: 0 0 0 1px #1d9e75;}

/* Handle */
.handle{
  position:absolute;width:14px;height:14px;background:#1d9e75;
  border:2px solid white;border-radius:50%;z-index:25;display:none;
}
.elem.selected .handle{display:block;}
.nw{top:-7px;left:-7px;cursor:nwse-resize;}
.ne{top:-7px;right:-7px;cursor:nesw-resize;}
.sw{bottom:-7px;left:-7px;cursor:nesw-resize;}
.se{bottom:-7px;right:-7px;cursor:nwse-resize;}
.rot{top:-30px;left:calc(50% - 7px);cursor:crosshair;background:#ff9800;}

#props{
  padding:5px 12px;border-top:1px solid #eee;background:white;
  font-size:11px;color:#888;display:flex;align-items:center;gap:12px;
  flex-wrap:wrap;min-height:40px;flex-shrink:0;
}
</style>
</head>
<body>

<div id="toolbar">
  <div class="tb-group">
    <button id="btn-select" class="active" onclick="setTool('select')">▷ 選択</button>
    <button id="btn-chair" onclick="setTool('chair')">○ 椅子</button>
    <button id="btn-arc" onclick="setTool('arc')">⌒ 弧配置</button>
    <button id="btn-line" onclick="setTool('line')">｜ 線配置</button>
    <button id="btn-label" onclick="setTool('label')">Ａ ラベル</button>
    <button id="btn-rect" onclick="setTool('rect')">□ 四角</button>
    <button id="btn-dim" onclick="setTool('dim')">↔ 寸法</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="undo-btn" onclick="undo()" title="Ctrl+Z">↩ 戻す</button>
    <button id="redo-btn" onclick="redo()" title="Ctrl+Y">↪ 進む</button>
    <button onclick="groupSelected()" id="group-btn">グループ</button>
    <button onclick="ungroup()" id="ungroup-btn">解除</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button onclick="exportTemplate()">💾 保存</button>
    <button onclick="importTemplate()">📂 読込</button>
    <button onclick="loadPDF()">📄 PDF</button>
    <button onclick="exportPNG()" style="background:#1d9e75;color:white;">📷 PNG</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('main',this)">木管・金管</div>
      <div class="tab" onclick="switchTab('other',this)">その他</div>
    </div>
    <div id="tab-main" class="inst-list"></div>
    <div id="tab-other" class="inst-list" style="display:none"></div>
  </div>

  <div id="canvas-wrap">
    <div id="zoom-container">
      <div id="stage" style="width:960px;height:700px;">
        <canvas id="bg" style="display:none;position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;"></canvas>
        <div class="stage-grid"></div>
        <svg id="svg-layer" style="position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:3;"></svg>
      </div>
    </div>
  </div>
</div>

<div id="props">要素を選択して編集</div>

<script>
const MAIN_INST=[
  {l:"Pic",c:"#e35"},{l:"Fl",c:"#e35"},{l:"Ob",c:"#c44"},
  {l:"B♭Cl",c:"#36a"},{l:"B.Cl",c:"#36a"},
  {l:"A.Sax",c:"#1a8"},{l:"T.Sax",c:"#1a8"},{l:"B.Sax",c:"#1a8"},
  {l:"Fg",c:"#c44"},{l:"Tp",c:"#c70"},{l:"Tb",c:"#a84"},
  {l:"Hr",c:"#84a"},{l:"Tu",c:"#08a"},
  {l:"Eu",c:"#08a"},{l:"Stb",c:"#555"}
];
const OTHER_INST=[
  {l:"Cor Angl.",c:"#c44"},{l:"E♭Cl",c:"#36a"},{l:"A.Cl",c:"#36a"},
  {l:"CA.Cl",c:"#36a"},{l:"S.Sax",c:"#1a8"}
];

let elements=[];
let selectedList=[];
let tool='select';
let zoomLevel=1.0;
let chairSize=26;
let idCounter=0;
let gCounter=0;
let currentInst=MAIN_INST[0];

let draggingObjs=[], dragStartPt={x:0,y:0};
let resizingObj=null, resizeHandle='', rotatingObj=null, startAng=0, startMouseAng=0;
let arcPts=[], linePts=[], dimStart=null;
let history=[], historyIndex=-1;

const stage=document.getElementById('stage');
const svg=document.getElementById('svg-layer');
const zoomCont=document.getElementById('zoom-container');

function init(){
  buildList(MAIN_INST,'tab-main');
  buildList(OTHER_INST,'tab-other');
  setupEvents();
  fitZoom();
  saveHistory();
}

function buildList(list,id){
  const container=document.getElementById(id);
  list.forEach(inst=>{
    const div=document.createElement('div');
    div.className='inst';
    div.innerHTML=`<span class="inst-dot" style="background:${inst.c}"></span>${inst.l}`;
    div.onclick=()=>{
      document.querySelectorAll('.inst').forEach(el=>el.classList.remove('active'));
      div.classList.add('active');
      currentInst=inst;
      if(tool==='select') setTool('chair');
    };
    container.appendChild(div);
  });
}

function switchTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-main').style.display=t==='main'?'':'none';
  document.getElementById('tab-other').style.display=t==='other'?'':'none';
}

function setTool(t){
  tool=t;
  document.querySelectorAll('button[id^=btn-]').forEach(b=>b.classList.remove('active'));
  document.getElementById('btn-'+t)?.classList.add('active');
  clearSelection();
}

function setupEvents(){
  stage.addEventListener('pointerdown', onDown, {passive:false});
  window.addEventListener('pointermove', onMove, {passive:false});
  window.addEventListener('pointerup', onUp);
  window.addEventListener('keydown', e => {
    if(e.ctrlKey && e.key === 'z') undo();
    if(e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) redo();
    if(e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
  });
}

function getXY(e){
  const r=stage.getBoundingClientRect();
  return {x:(e.clientX-r.left)/zoomLevel, y:(e.clientY-r.top)/zoomLevel};
}

function onDown(e){
  const pt=getXY(e);
  if(e.target.classList.contains('handle')){
    const rec=elements.find(el=>el.dom===e.target.parentElement);
    if(e.target.classList.contains('rot')){
      rotatingObj=rec;
      const center={x:rec.x+rec.w/2, y:rec.y+rec.h/2};
      startMouseAng=Math.atan2(pt.y-center.y, pt.x-center.x);
      startAng=rec.angle || 0;
    } else {
      resizingObj=rec;
      resizeHandle=e.target.dataset.pos;
    }
    e.stopPropagation(); return;
  }

  const elemDiv=e.target.closest('.elem');
  if(elemDiv){
    const rec=elements.find(el=>el.id==elemDiv.dataset.id);
    if(tool==='select'){
      if(e.shiftKey){
        toggleSelect(rec);
      } else {
        if(!selectedList.includes(rec)) selectSingle(rec);
      }
      // グループ移動の準備
      draggingObjs = [];
      selectedList.forEach(obj => {
        if(obj.gid){
          elements.filter(el => el.gid === obj.gid).forEach(m => {
            if(!draggingObjs.find(d => d.obj === m)) draggingObjs.push({obj: m, ox: pt.x-m.x, oy: pt.y-m.y});
          });
        } else {
          draggingObjs.push({obj: obj, ox: pt.x-obj.x, oy: pt.y-obj.y});
        }
      });
    }
    return;
  }

  if(tool==='select') clearSelection();
  else if(tool==='chair') addElem('chair',pt.x-chairSize/2,pt.y-chairSize/2);
  else if(tool==='label') addElem('label',pt.x-50,pt.y-15,{text:prompt('内容','')||'ラベル'});
  else if(tool==='rect') addElem('rect',pt.x-50,pt.y-30);
  
  if(tool!=='select') saveHistory();
}

function onMove(e){
  const pt=getXY(e);
  if(draggingObjs.length>0){
    draggingObjs.forEach(d=>{
      d.obj.x=pt.x-d.ox; d.obj.y=pt.y-d.oy;
      d.obj.dom.style.left=d.obj.x+'px'; d.obj.dom.style.top=d.obj.y+'px';
    });
  }
  if(resizingObj){
    const rec=resizingObj;
    if(resizeHandle==='se'){ rec.w=Math.max(20,pt.x-rec.x); rec.h=Math.max(20,pt.y-rec.y); }
    else if(resizeHandle==='sw'){ const oldR=rec.x+rec.w; rec.x=pt.x; rec.w=Math.max(20,oldR-pt.x); rec.h=Math.max(20,pt.y-rec.y); }
    else if(resizeHandle==='ne'){ const oldB=rec.y+rec.h; rec.y=pt.y; rec.h=Math.max(20,oldB-pt.y); rec.w=Math.max(20,pt.x-rec.x); }
    else if(resizeHandle==='nw'){ const oldR=rec.x+rec.w; const oldB=rec.y+rec.h; rec.x=pt.x; rec.y=pt.y; rec.w=Math.max(20,oldR-pt.x); rec.h=Math.max(20,oldB-pt.y); }
    rec.dom.style.left=rec.x+'px'; rec.dom.style.top=rec.y+'px'; rec.dom.style.width=rec.w+'px'; rec.dom.style.height=rec.h+'px';
  }
  if(rotatingObj){
    const rec=rotatingObj;
    const center={x:rec.x+rec.w/2, y:rec.y+rec.h/2};
    rec.angle = startAng + (Math.atan2(pt.y-center.y, pt.x-center.x) - startMouseAng) * 180 / Math.PI;
    rec.dom.style.transform = `rotate(${rec.angle}deg)`;
  }
}

function onUp(){ 
  if(draggingObjs.length>0 || resizingObj || rotatingObj) saveHistory();
  draggingObjs=[]; resizingObj=null; rotatingObj=null;
}

function selectSingle(rec){ clearSelection(); selectedList=[rec]; rec.dom.classList.add('selected'); updateProps(); }
function toggleSelect(rec){
  if(selectedList.includes(rec)){ selectedList=selectedList.filter(x=>x!==rec); rec.dom.classList.remove('selected'); }
  else { selectedList.push(rec); rec.dom.classList.add('selected'); }
  updateProps();
}
function clearSelection(){ selectedList.forEach(el=>el.dom.classList.remove('selected')); selectedList=[]; updateProps(); }

function addElem(type,x,y,opts={}){
  const id=opts.id || ++idCounter;
  const div=document.createElement('div');
  div.className='elem'; div.dataset.id=id;
  div.style.left=x+'px'; div.style.top=y+'px';
  const color=opts.color||(type==='rect'?'#555555':currentInst.c);
  const w=opts.w || (type==='chair'?chairSize:100); 
  const h=opts.h || (type==='chair'?chairSize:60);
  const bw=opts.bw || 2;
  const ang=opts.angle||0;
  const gid=opts.gid || null;

  div.style.width=w+'px'; div.style.height=h+'px';
  div.style.transform=`rotate(${ang}deg)`;
  if(gid) div.classList.add('grouped-member');

  if(type==='chair'){
    div.innerHTML=`<div class="chair" style="border-color:${color};color:${color};"><div class="chair-text" style="font-size:${Math.max(7,w/3.2)}px">${opts.label||currentInst.l}</div></div>`;
  } else {
    div.className += (type==='label'?' label-elem':' rect-elem');
    div.style.color=color; div.style.borderColor=color; div.style.borderWidth=bw+'px';
    div.textContent=opts.text||'';
    ['nw','ne','sw','se','rot'].forEach(pos=>{ 
      const hdl=document.createElement('div'); hdl.className='handle '+pos; 
      if(pos!=='rot') hdl.dataset.pos=pos; div.appendChild(hdl); 
    });
  }
  stage.appendChild(div);
  const rec={id,type,dom:div,x,y,color,w,h,bw,angle:ang,gid,label:opts.label||currentInst.l,text:opts.text||'',opacity:opts.opacity||1};
  elements.push(rec); return rec;
}

function updateProps(){
  const p=document.getElementById('props');
  if(selectedList.length===0){ p.textContent='要素を選択して編集（Shift+クリックで複数選択）'; return; }
  if(selectedList.length>1){ p.innerHTML=`${selectedList.length}個の要素を選択中 <button onclick="deleteSelected()" style="color:red">一括削除</button>`; return; }
  
  const s=selectedList[0];
  let h = '';
  if(s.type==='rect' || s.type==='label'){
    h += `色:<input type="color" value="${s.color}" onchange="updateSel('color',this.value)"> `;
    h += `太さ:<input type="number" min="1" max="10" value="${s.bw}" onchange="updateSel('bw',+this.value)"> `;
  }
  h += `内容:<input type="text" value="${s.type==='chair'?s.label:s.text}" onchange="updateSel('${s.type==='chair'?'label':'text'}',this.value)"> `;
  h += `<button onclick="deleteSelected()" style="color:red">削除</button>`;
  p.innerHTML=h;
}

function updateSel(key,val){
  selectedList.forEach(s=>{
    s[key]=val;
    if(key==='color'){ s.dom.style.color=val; s.dom.style.borderColor=val; if(s.dom.querySelector('.chair')) s.dom.querySelector('.chair').style.borderColor=val; }
    if(key==='bw') s.dom.style.borderWidth=val+'px';
    if(key==='label') s.dom.querySelector('.chair-text').textContent=val;
    if(key==='text'){ const hs=s.dom.querySelectorAll('.handle'); s.dom.textContent=val; hs.forEach(h=>s.dom.appendChild(h)); }
  });
  saveHistory();
}

function groupSelected(){
  if(selectedList.length < 2) return;
  const gid = ++gCounter;
  selectedList.forEach(s => {
    s.gid = gid;
    s.dom.classList.add('grouped-member');
  });
  saveHistory();
}

function ungroup(){
  selectedList.forEach(s => {
    if(s.gid){
      const id = s.gid;
      elements.filter(el => el.gid === id).forEach(m => {
        m.gid = null;
        m.dom.classList.remove('grouped-member');
      });
    }
  });
  saveHistory();
}

function deleteSelected(){
  selectedList.forEach(s=>{ s.dom.remove(); elements=elements.filter(x=>x.id!==s.id); });
  clearSelection(); saveHistory();
}

function undo(){ if(historyIndex>0){ historyIndex--; applyState(); } }
function redo(){ if(historyIndex<history.length-1){ historyIndex++; applyState(); } }
function applyState(){
  const state=JSON.parse(history[historyIndex]);
  elements.forEach(e=>e.dom.remove()); elements=[];
  state.elements.forEach(en=>addElem(en.type, en.x, en.y, en));
  clearSelection();
}
function saveHistory(){
  const state={elements: elements.map(e=>({...e, dom:null}))};
  history=history.slice(0, historyIndex+1); history.push(JSON.stringify(state));
  if(history.length>30) history.shift(); else historyIndex++;
  document.getElementById('undo-btn').disabled=historyIndex<=0;
  document.getElementById('redo-btn').disabled=historyIndex>=history.length-1;
}

function fitZoom(){ zoomLevel=Math.min(1.0, (document.getElementById('canvas-wrap').clientWidth-40)/stage.offsetWidth); applyZoom(); }
function applyZoom(){ zoomCont.style.transform=`scale(${zoomLevel})`; }
function exportPNG(){ html2canvas(stage,{scale:2}).then(c=>{ const a=document.createElement('a'); a.download='stage.png'; a.href=c.toDataURL(); a.click(); }); }

window.onload=init;
</script>
</body>
</html>
