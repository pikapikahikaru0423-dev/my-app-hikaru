<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舞台配置図 v15.1 安定版</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{display:flex;flex-direction:column;height:100vh;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:#d8d6cf;overflow:hidden;}

#toolbar{
display:flex;align-items:center;gap:6px;flex-wrap:wrap;
padding:5px 10px;background:white;border-bottom:1px solid #ddd;
min-height:42px;
}

button{
padding:4px 10px;font-size:11px;border:1px solid #ccc;border-radius:5px;
background:white;cursor:pointer;
}
button.active{background:#e1f5ee;border-color:#1d9e75;color:#0f6e56;font-weight:600;}

#main{display:flex;flex:1;overflow:hidden;}

#sidebar{
width:160px;background:white;border-right:1px solid #ddd;
display:flex;flex-direction:column;
}

#canvas-wrap{
flex:1;overflow:auto;background:#d8d6cf;position:relative;
}

#zoom-container{
transform-origin:top left;
position:absolute;top:20px;left:20px;
}

#stage{
position:relative;background:white;
border:1px solid #aaa;
box-shadow:0 2px 16px rgba(0,0,0,.18);
}

.elem{position:absolute;cursor:move;user-select:none;}

.chair{
border-radius:50%;border:2px solid;background:white;
display:flex;align-items:center;justify-content:center;
font-size:11px;
}

.label{
font-size:11px;background:white;border:1px solid #aaa;padding:2px 6px;
}

.rect-elem{border:2px solid #555;background:rgba(200,200,200,.1);}

#svg-layer{
position:absolute;inset:0;overflow:visible;pointer-events:none;
}
</style>
</head>

<body>

<div id="toolbar">

<button onclick="setTool('select')" id="btn-select">選択</button>
<button onclick="setTool('chair')" id="btn-chair">椅子</button>
<button onclick="setTool('arc')" id="btn-arc">弧</button>
<button onclick="setTool('label')" id="btn-label">ラベル</button>
<button onclick="setTool('rect')" id="btn-rect">矩形</button>
<button onclick="setTool('dim')" id="btn-dim">寸法</button>

<button onclick="groupSelected()">Group</button>
<button onclick="exportPNG()">PNG</button>

</div>

<div id="main">

<div id="sidebar">
<div style="padding:10px;font-size:11px;color:#888;">v15.1</div>
</div>

<div id="canvas-wrap">

<div id="zoom-container">
<div id="stage">
<canvas id="bg"></canvas>
<div class="stage-grid"></div>
<svg id="svg-layer"></svg>
</div>
</div>

</div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ───── STATE ───── */
let tool='select';
let elements=[];
let selected=null;

let zoomLevel=1;
let stageW=960,stageH=760;

let arcPts=[];
let dimStart=null;
let dims=[];

let groupId=1;
let idCounter=0;

/* ───── DOM ───── */
const stage=document.getElementById('stage');
const svg=document.getElementById('svg-layer');
const zoomC=document.getElementById('zoom-container');

/* ───── TOOL ───── */
function setTool(t){
tool=t;
arcPts=[];
dimStart=null;
}

/* ───── STAGE ───── */
function setStageSize(w,h){
stageW=w;stageH=h;
stage.style.width=w+'px';
stage.style.height=h+'px';
svg.setAttribute('width',w);
svg.setAttribute('height',h);
updateZoom();
}

/* ───── ZOOM ───── */
function updateZoom(){
zoomC.style.transform=`scale(${zoomLevel})`;
zoomC.style.width=(stageW*zoomLevel)+'px';
zoomC.style.height=(stageH*zoomLevel)+'px';
}

/* ───── ADD ───── */
function add(type,x,y,opts={}){
const el=document.createElement('div');
el.className='elem';
el.style.left=x+'px';
el.style.top=y+'px';

const obj={id:++idCounter,type,x,y,el};

if(type==='chair'){
const c=document.createElement('div');
c.className='chair';
c.style.width=(opts.size||26)+'px';
c.style.height=(opts.size||26)+'px';
c.textContent=opts.label||'●';
el.appendChild(c);
}

if(type==='label'){
el.className='label elem';
el.textContent=opts.text||'label';
}

if(type==='rect'){
el.classList.add('rect-elem');
el.style.width=(opts.w||80)+'px';
el.style.height=(opts.h||50)+'px';
}

el.onmousedown=e=>drag(obj,e);

stage.appendChild(el);
elements.push(obj);
}

/* ───── DRAG ───── */
function drag(o,e){
if(tool!=='select')return;

const sx=e.clientX;
const sy=e.clientY;

const ox=o.x;
const oy=o.y;

function move(ev){
o.x=ox+(ev.clientX-sx)/zoomLevel;
o.y=oy+(ev.clientY-sy)/zoomLevel;
o.el.style.left=o.x+'px';
o.el.style.top=o.y+'px';
}

function up(){
document.removeEventListener('mousemove',move);
document.removeEventListener('mouseup',up);
}

document.addEventListener('mousemove',move);
document.addEventListener('mouseup',up);
}

/* ───── STAGE CLICK ───── */
stage.addEventListener('mousedown',e=>{
if(e.target!==stage)return;

const r=stage.getBoundingClientRect();
const x=(e.clientX-r.left)/zoomLevel;
const y=(e.clientY-r.top)/zoomLevel;

if(tool==='chair')add('chair',x,y);
if(tool==='label')add('label',x,y);
if(tool==='rect')add('rect',x,y);

/* ───── ARC（既存維持）───── */
if(tool==='arc'){
arcPts.push({x,y});
if(arcPts.length===3){
const n=8;
for(let i=0;i<n;i++){
const t=i/(n-1);
const p=bez(arcPts[0],arcPts[1],arcPts[2],t);
add('chair',p.x,p.y);
}
arcPts=[];
}
}

/* ───── DIM（手入力化）───── */
if(tool==='dim'){
if(!dimStart){
dimStart={x,y};
}else{

const value=prompt("寸法を入力（cm）","");
if(value===null){dimStart=null;return;}

dims.push({
x1:dimStart.x,
y1:dimStart.y,
x2:x,
y2:y,
dist:value
});

dimStart=null;
renderDim();
}
}
});

/* ───── BEZIER ───── */
function bez(p0,p1,p2,t){
return {
x:(1-t)*(1-t)*p0.x+2*(1-t)*t*p1.x+t*t*p2.x,
y:(1-t)*(1-t)*p0.y+2*(1-t)*t*p1.y+t*t*p2.y
};
}

/* ───── DIM RENDER ───── */
function renderDim(){
svg.innerHTML='';

dims.forEach(d=>{

const line=document.createElementNS('http://www.w3.org/2000/svg','line');
line.setAttribute('x1',d.x1);
line.setAttribute('y1',d.y1);
line.setAttribute('x2',d.x2);
line.setAttribute('y2',d.y2);
line.setAttribute('stroke','#1d9e75');
line.setAttribute('stroke-dasharray','5,3');

const text=document.createElementNS('http://www.w3.org/2000/svg','text');
text.setAttribute('x',(d.x1+d.x2)/2);
text.setAttribute('y',(d.y1+d.y2)/2);
text.setAttribute('font-size','10');
text.setAttribute('fill','#1d9e75');
text.textContent=d.dist+'cm';

svg.appendChild(line);
svg.appendChild(text);
});
}

/* ───── GROUP ───── */
function groupSelected(){
selected=null;
}

/* ───── PNG ───── */
function exportPNG(){
html2canvas(stage,{
scale:2,
backgroundColor:'#fff'
}).then(c=>{
const a=document.createElement('a');
a.href=c.toDataURL('image/png');
a.download='stage.png';
a.click();
});
}

/* ───── INIT ───── */
setStageSize(960,760);
updateZoom();
renderDim();

</script>

</body>
</html>
