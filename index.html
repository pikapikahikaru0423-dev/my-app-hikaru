<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>舞台配置図 Pro v16</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{display:flex;flex-direction:column;height:100vh;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:#d8d6cf;overflow:hidden;touch-action:none;}

/* Toolbar */
#toolbar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:5px 10px;background:white;border-bottom:1px solid #ddd;
  min-height:42px;flex-shrink:0;z-index:100;
}
.tb-group{display:flex;align-items:center;gap:4px;}
.tb-sep{width:1px;height:22px;background:#e0e0e0;margin:0 2px;}
.tb-label{font-size:10px;color:#999;white-space:nowrap;}

button{
  padding:6px 12px;font-size:11px;border:1px solid #ccc;border-radius:5px;
  background:white;cursor:pointer;color:#333;white-space:nowrap;
  transition:background .12s;
}
button:hover{background:#f0f0ee;}
button:disabled{opacity:0.3;cursor:default;}
button.active{background:#e1f5ee;border-color:#1d9e75;color:#0f6e56;font-weight:600;}

input[type=range]{width:80px;}
input[type=number]{width:48px;padding:3px 5px;font-size:11px;border:1px solid #ccc;border-radius:4px;}

/* Main structure */
#main{display:flex;flex:1;overflow:hidden;}

#sidebar{
  width:160px;min-width:160px;background:white;border-right:1px solid #ddd;
  display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
}
.tabs{display:flex;border-bottom:1px solid #eee;flex-shrink:0;}
.tab{flex:1;padding:10px 2px;text-align:center;border-bottom:2px solid transparent;cursor:pointer;font-size:11px;color:#888;}
.tab.active{border-color:#1d9e75;color:#1d9e75;font-weight:600;}
.inst-list{flex:1;overflow-y:auto;}
.inst{padding:8px 10px;font-size:12px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;align-items:center;gap:6px;}
.inst.active{background:#e1f5ee;}
.inst-dot{width:8px;height:8px;border-radius:50%;}

#canvas-wrap{flex:1;overflow:auto;background:#d8d6cf;position:relative;}
#zoom-container{transform-origin:top left;position:absolute;top:20px;left:20px;}
#stage{
  position:relative;background:white;border:1px solid #aaa;
  box-shadow:0 2px 16px rgba(0,0,0,.18);overflow:visible;touch-action:none;
}
#bg{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;opacity:.5;display:none;z-index:1;}
.stage-grid{position:absolute;inset:0;pointer-events:none;z-index:2;
  background-image:linear-gradient(rgba(0,0,0,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.05) 1px,transparent 1px);
  background-size:30px 30px;}
#svg-layer{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:3;}

/* Elements */
.elem{position:absolute;cursor:move;user-select:none;touch-action:none;z-index:10;pointer-events:auto;}
.chair{
  border-radius:50%;border:2px solid;background:white;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;position:relative;
}
.chair-text{position:absolute;white-space:nowrap;pointer-events:none;text-align:center;}
.elem.selected .chair{outline:2px solid #1d9e75;outline-offset:2px;}

.label-elem{font-size:11px;background:white;padding:2px 6px;border:1px solid #aaa;border-radius:3px;white-space:nowrap;}
.rect-elem{border:2px solid #555;background:rgba(200,200,200,0.1);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;overflow:hidden;}

/* Group highlight */
.elem.grouped-member{box-shadow: 0 0 0 1px #1d9e75;}

/* Resize Handles */
.resize-handle{
  position:absolute;width:18px;height:18px;background:#1d9e75;
  border:2px solid white;border-radius:50%;z-index:20;display:none;
}
.elem.selected .resize-handle{display:block;}
.nw{top:-9px;left:-9px;cursor:nwse-resize;}
.ne{top:-9px;right:-9px;cursor:nesw-resize;}
.sw{bottom:-9px;left:-9px;cursor:nesw-resize;}
.se{bottom:-9px;right:-9px;cursor:nwse-resize;}

/* Panels */
#arc-panel,#line-panel{
  position:fixed;top:55px;left:175px;background:white;border:1px solid #ccc;
  border-radius:8px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,0.2);
  display:none;z-index:1000;font-size:11px;min-width:180px;
}
.visible{display:block !important;}
.panel-row{display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.panel-row label{width:60px;color:#666;}
.step{display:flex;align-items:center;gap:6px;margin:4px 0;color:#1d9e75;font-weight:600;}
.step-num{width:16px;height:16px;background:#1d9e75;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;}

#props{
  padding:5px 12px;border-top:1px solid #eee;background:white;
  font-size:11px;color:#888;display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;min-height:40px;flex-shrink:0;
}
#props input{padding:4px;border:1px solid #ccc;border-radius:4px;}
</style>
</head>
<body>

<div id="toolbar">
  <div class="tb-group">
    <button id="btn-select" class="active" onclick="setTool('select')">▷ 選択</button>
    <button id="btn-chair" onclick="setTool('chair')">○ 椅子</button>
    <button id="btn-arc" onclick="setTool('arc')">⌒ 弧配置</button>
    <button id="btn-line" onclick="setTool('line')">｜ 棒配置</button>
    <button id="btn-label" onclick="setTool('label')">Ａ ラベル</button>
    <button id="btn-rect" onclick="setTool('rect')">□ 矩形</button>
    <button id="btn-dim" onclick="setTool('dim')">↔ 寸法</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button id="undo-btn" onclick="undo()" title="Ctrl+Z">↩ 戻す</button>
    <button id="redo-btn" onclick="redo()" title="Ctrl+Y">↪ 進む</button>
    <button onclick="ungroup()" id="ungroup-btn">解除</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <button onclick="exportTemplate()">💾 保存</button>
    <button onclick="importTemplate()">📂 読込</button>
    <button onclick="loadPDF()">📄 PDF</button>
    <button onclick="exportPNG()" style="background:#1d9e75;color:white;">📷 PNG</button>
  </div>
  <div class="tb-sep"></div>
  <div class="tb-group">
    <span class="tb-label">サイズ</span>
    <input type="range" id="chairSlider" min="15" max="60" value="26" oninput="setChairSize(+this.value)">
    <span id="chairVal">26</span>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('main',this)">木管・金管</div>
      <div class="tab" onclick="switchTab('other',this)">その他</div>
    </div>
    <div id="tab-main" class="inst-list"></div>
    <div id="tab-other" class="inst-list" style="display:none"></div>
  </div>

  <div id="canvas-wrap">
    <div id="zoom-container">
      <div id="stage" style="width:960px;height:700px;">
        <canvas id="bg"></canvas>
        <div class="stage-grid"></div>
        <svg id="svg-layer"></svg>
      </div>
    </div>
  </div>
</div>

<div id="props">要素を選択して編集</div>

<div id="arc-panel">
  <div style="font-weight:bold;margin-bottom:8px;">⌒ 弧配置</div>
  <div class="panel-row">
    <label>椅子の数</label><input type="number" id="arcN" value="4" min="1">
  </div>
  <div class="step"><span class="step-num">1</span>始点</div>
  <div class="step"><span class="step-num">2</span>終点</div>
  <div class="step"><span class="step-num">3</span>膨らみ</div>
  <button onclick="resetArc()" style="width:100%;margin-top:10px;padding:6px;background:#f5f5f5;border:1px solid #ccc;">リセット</button>
</div>

<div id="line-panel">
  <div style="font-weight:bold;margin-bottom:8px;">｜ 棒配置</div>
  <div class="panel-row">
    <label>椅子の数</label><input type="number" id="lineN" value="4" min="1">
  </div>
  <div class="step"><span class="step-num">1</span>始点</div>
  <div class="step"><span class="step-num">2</span>終点</div>
  <button onclick="resetLine()" style="width:100%;margin-top:10px;padding:6px;background:#f5f5f5;border:1px solid #ccc;">リセット</button>
</div>

<script>
// --- Data & State ---
const MAIN_INST=[{l:"Pic",c:"#e35"},{l:"Fl",c:"#e35"},{l:"Ob",c:"#c44"},{l:"B♭Cl",c:"#36a"},{l:"B.Cl",c:"#36a"},{l:"A.Sax",c:"#1a8"},{l:"T.Sax",c:"#1a8"},{l:"B.Sax",c:"#1a8"},{l:"Tp",c:"#c70"},{l:"Tb",c:"#a84"},{l:"Hr",c:"#84a"},{l:"Eu",c:"#08a"},{l:"Tu",c:"#08a"},{l:"Stb",c:"#555"}];
const OTHER_INST=[{l:"E♭Cl",c:"#36a"},{l:"S.Sax",c:"#1a8"},{l:"Fag",c:"#c44"},{l:"Drums",c:"#666"},{l:"Timp",c:"#666"},{l:"Perc",c:"#666"},{l:"Pf",c:"#333"}];

let elements=[];
let selected=null;
let tool='select';
let zoomLevel=1.0;
let chairSize=26;
let idCounter=0;
let gCounter=0;
let currentInst=MAIN_INST[0];

let dragging=null, dragStart={x:0,y:0};
let resizing=null, resizeHandle='';
let arcPts=[], linePts=[], dimStart=null;
let isHandling = false;

// History for Undo/Redo
let history = [];
let historyIndex = -1;

const stage=document.getElementById('stage');
const svg=document.getElementById('svg-layer');
const zoomCont=document.getElementById('zoom-container');

function init(){
  buildList(MAIN_INST,'tab-main');
  buildList(OTHER_INST,'tab-other');
  setupEvents();
  fitZoom();
  saveHistory();
}

function buildList(list,id){
  const container=document.getElementById(id);
  list.forEach(inst=>{
    const div=document.createElement('div');
    div.className='inst';
    div.innerHTML=`<span class="inst-dot" style="background:${inst.c}"></span>${inst.l}`;
    div.onclick=()=>{
      document.querySelectorAll('.inst').forEach(el=>el.classList.remove('active'));
      div.classList.add('active');
      currentInst=inst;
      if(tool==='select') setTool('chair');
    };
    container.appendChild(div);
  });
}

function switchTab(t,el){
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-main').style.display=t==='main'?'':'none';
  document.getElementById('tab-other').style.display=t==='other'?'':'none';
}

function setTool(t){
  tool=t;
  document.querySelectorAll('button[id^=btn-]').forEach(b=>b.classList.remove('active'));
  const btn=document.getElementById('btn-'+t);
  if(btn) btn.classList.add('active');
  document.getElementById('arc-panel').classList.toggle('visible',t==='arc');
  document.getElementById('line-panel').classList.toggle('visible',t==='line');
  svg.style.pointerEvents=(['arc','line','dim'].includes(t))?'auto':'none';
  resetArc(); resetLine(); dimStart=null;
  selectElem(null);
}

function setupEvents(){
  stage.addEventListener('pointerdown', onDown, {passive:false});
  window.addEventListener('pointermove', onMove, {passive:false});
  window.addEventListener('pointerup', onUp);
  window.addEventListener('keydown', e => {
    if(e.ctrlKey && e.key === 'z') undo();
    if(e.ctrlKey && (e.key === 'y' || (e.shiftKey && e.key === 'Z'))) redo();
  });
}

function getXY(e){
  const r=stage.getBoundingClientRect();
  return {x:(e.clientX-r.left)/zoomLevel, y:(e.clientY-r.top)/zoomLevel};
}

function onDown(e){
  if(isHandling) return;
  isHandling = true;
  setTimeout(() => { isHandling = false; }, 300);

  if (e.cancelable) e.preventDefault();
  const pt=getXY(e);

  if(tool==='arc'){ handleArc(pt); return; }
  if(tool==='line'){ handleLine(pt); return; }
  if(tool==='dim'){ handleDim(pt); return; }

  if(e.target.classList.contains('resize-handle')){
    resizing=elements.find(el=>el.dom===e.target.parentElement);
    resizeHandle=e.target.dataset.pos;
    e.stopPropagation(); return;
  }

  const elemDiv=e.target.closest('.elem');
  if(elemDiv){
    const rec=elements.find(el=>el.id==elemDiv.dataset.id);
    if(tool==='select'){
      selectElem(rec);
      dragging=rec;
      dragStart={x:pt.x-rec.x, y:pt.y-rec.y};
    }
    return;
  }

  if(tool==='chair') { addElem('chair',pt.x-chairSize/2,pt.y-chairSize/2); saveHistory(); }
  else if(tool==='label') { addElem('label',pt.x,pt.y,{text:prompt('ラベル内容','')}); saveHistory(); }
  else if(tool==='rect') { addElem('rect',pt.x,pt.y); saveHistory(); }
  else if(tool==='select') selectElem(null);
}

function onMove(e){
  const pt=getXY(e);
  if(dragging){
    const dx=pt.x-dragStart.x; const dy=pt.y-dragStart.y;
    if(dragging.gid){
      const members=elements.filter(el=>el.gid===dragging.gid);
      const offX=dx-dragging.x; const offY=dy-dragging.y;
      members.forEach(m=>{ m.x+=offX; m.y+=offY; m.dom.style.left=m.x+'px'; m.dom.style.top=m.y+'px'; });
    } else {
      dragging.x=dx; dragging.y=dy; dragging.dom.style.left=dx+'px'; dragging.dom.style.top=dy+'px';
    }
    updateProps();
  }
  if(resizing){
    const rec=resizing;
    if(resizeHandle==='se'){ rec.w=Math.max(30,pt.x-rec.x); rec.h=Math.max(20,pt.y-rec.y); }
    else if(resizeHandle==='sw'){ const oldR=rec.x+rec.w; rec.x=pt.x; rec.w=Math.max(30,oldR-pt.x); rec.h=Math.max(20,pt.y-rec.y); }
    else if(resizeHandle==='ne'){ const oldB=rec.y+rec.h; rec.y=pt.y; rec.h=Math.max(20,oldB-pt.y); rec.w=Math.max(30,pt.x-rec.x); }
    else if(resizeHandle==='nw'){ const oldR=rec.x+rec.w; const oldB=rec.y+rec.h; rec.x=pt.x; rec.y=pt.y; rec.w=Math.max(30,oldR-pt.x); rec.h=Math.max(20,oldB-pt.y); }
    rec.dom.style.left=rec.x+'px'; rec.dom.style.top=rec.y+'px'; rec.dom.style.width=rec.w+'px'; rec.dom.style.height=rec.h+'px';
  }
  if(tool==='arc' && arcPts.length>0) drawArcPreview(pt);
  if(tool==='line' && linePts.length>0) drawLinePreview(pt);
}

function onUp(){ 
  if(dragging || resizing) saveHistory();
  dragging=null; resizing=null; 
}

// --- Logic ---
function handleArc(pt){
  arcPts.push(pt);
  if(arcPts.length===3){
    const n=parseInt(document.getElementById('arcN').value)||4;
    const gid=++gCounter;
    const [p0, p1, p2]=arcPts;
    for(let i=0; i<n; i++){
      const t=(n===1)?0.5:i/(n-1);
      const x=Math.pow(1-t,2)*p0.x + 2*(1-t)*t*p2.x + Math.pow(t,2)*p1.x;
      const y=Math.pow(1-t,2)*p0.y + 2*(1-t)*t*p2.y + Math.pow(t,2)*p1.y;
      addElem('chair',x-chairSize/2,y-chairSize/2,{groupId:gid});
    }
    resetArc();
    saveHistory();
  }
}
function drawArcPreview(pt){
  clearSVG('arc-pre');
  if(arcPts.length===1) drawLine(arcPts[0],pt,'arc-pre',true);
  else if(arcPts.length===2){
    const p0=arcPts[0], p1=arcPts[1], p2=pt;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M ${p0.x} ${p0.y} Q ${p2.x} ${p2.y} ${p1.x} ${p1.y}`);
    path.setAttribute('stroke','#1d9e75'); path.setAttribute('fill','none');
    path.setAttribute('stroke-dasharray','5,5'); path.classList.add('arc-pre');
    svg.appendChild(path);
  }
}
function resetArc(){ arcPts=[]; clearSVG('arc-pre'); }

function handleLine(pt){
  linePts.push(pt);
  if(linePts.length===2){
    const n=parseInt(document.getElementById('lineN').value)||4;
    const gid=++gCounter;
    const [p0,p1]=linePts;
    for(let i=0;i<n;i++){
      const t=(n===1)?0.5:i/(n-1);
      const x=p0.x+(p1.x-p0.x)*t; const y=p0.y+(p1.y-p0.y)*t;
      addElem('chair',x-chairSize/2,y-chairSize/2,{groupId:gid});
    }
    resetLine();
    saveHistory();
  }
}
function drawLinePreview(pt){
  clearSVG('line-pre');
  if(linePts[0]) drawLine(linePts[0],pt,'line-pre',true);
}
function resetLine(){ linePts=[]; clearSVG('line-pre'); }

// --- v16 Dimension Logic (Manual Entry) ---
function handleDim(pt){
  if(!dimStart) dimStart=pt;
  else {
    const val = prompt("寸法値を入力してください (例: 500cm)", "");
    if(val !== null){
      const g=document.createElementNS('http://www.w3.org/2000/svg','g');
      g.setAttribute('class', 'dim-group');
      const l=document.createElementNS('http://www.w3.org/2000/svg','line');
      l.setAttribute('x1',dimStart.x); l.setAttribute('y1',dimStart.y);
      l.setAttribute('x2',pt.x); l.setAttribute('y2',pt.y);
      l.setAttribute('stroke','#1d9e75'); l.setAttribute('stroke-width','2');
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',(dimStart.x+pt.x)/2); t.setAttribute('y',(dimStart.y+pt.y)/2 - 8);
      t.setAttribute('fill','#1d9e75'); t.setAttribute('font-size','12'); t.setAttribute('font-weight','bold');
      t.setAttribute('text-anchor','middle'); t.textContent=val;
      g.appendChild(l); g.appendChild(t); svg.appendChild(g);
      saveHistory();
    }
    dimStart=null;
  }
}

function addElem(type,x,y,opts={}){
  const id=opts.id || ++idCounter;
  const div=document.createElement('div');
  div.className='elem'; div.dataset.id=id;
  div.style.left=x+'px'; div.style.top=y+'px';
  const color=opts.color||currentInst.c;
  const label=opts.label||currentInst.l;
  const gid=opts.gid || opts.groupId || null;
  const w=opts.w || 100; const h=opts.h || 60;
  const sz=opts.size||chairSize;
  const text=opts.text||'';

  if(type==='chair'){
    div.innerHTML=`<div class="chair" style="width:${sz}px;height:${sz}px;border-color:${color};color:${color};"><div class="chair-text" style="font-size:${Math.max(7,sz/3)}px">${label}</div></div>`;
  } else if(type==='label'){
    div.className+=' label-elem'; div.style.color=color; div.style.borderColor=color; div.textContent=text||'テキスト';
  } else if(type==='rect'){
    div.className+=' rect-elem'; div.style.width=w+'px'; div.style.height=h+'px'; div.style.borderColor=color; div.textContent=text;
    ['nw','ne','sw','se'].forEach(pos=>{ const handle=document.createElement('div'); handle.className='resize-handle '+pos; handle.dataset.pos=pos; div.appendChild(handle); });
  }
  stage.appendChild(div);
  const rec={id,type,dom:div,x,y,color,label,gid,w,h,text,size:sz};
  if(gid) div.classList.add('grouped-member');
  elements.push(rec); return rec;
}

function selectElem(rec){
  selected=rec; elements.forEach(el=>el.dom.classList.remove('selected'));
  if(rec){ rec.dom.classList.add('selected'); updateProps(); }
  else document.getElementById('props').textContent='要素を選択して編集';
}

function updateProps(){
  if(!selected) return;
  const s=selected;
  let html=`X:<input type="number" value="${Math.round(s.x)}" onchange="updateSel('x',+this.value)"> 
            Y:<input type="number" value="${Math.round(s.y)}" onchange="updateSel('y',+this.value)"> `;
  if(s.type==='chair') html+=`楽器:<input type="text" value="${s.label}" onchange="updateSel('label',this.value)"> `;
  else html+=`内容:<input type="text" value="${s.text}" onchange="updateSel('text',this.value)"> `;
  html+=`<button onclick="deleteSel()" style="color:red">削除</button>`;
  document.getElementById('props').innerHTML=html;
}

function updateSel(key,val){
  if(!selected) return;
  selected[key]=val;
  if(key==='x') selected.dom.style.left=val+'px';
  if(key==='y') selected.dom.style.top=val+'px';
  if(key==='label') { const t=selected.dom.querySelector('.chair-text'); if(t) t.textContent=val; }
  if(key==='text') { 
    if(selected.type==='label') selected.dom.textContent=val;
    else { const hs=selected.dom.querySelectorAll('.resize-handle'); selected.dom.textContent=val; hs.forEach(h=>selected.dom.appendChild(h)); }
  }
  saveHistory();
}

function deleteSel(){
  if(!selected) return;
  const toDel = selected.gid ? elements.filter(el=>el.gid===selected.gid) : [selected];
  toDel.forEach(m=>{ m.dom.remove(); elements=elements.filter(x=>x.id!==m.id); });
  selectElem(null);
  saveHistory();
}

// --- v16 Ungroup ---
function ungroup(){
  if(!selected || !selected.gid) return;
  const gid = selected.gid;
  elements.filter(el=>el.gid === gid).forEach(el=>{
    el.gid = null;
    el.dom.classList.remove('grouped-member');
  });
  saveHistory();
}

// --- Template Export/Import ---
function exportTemplate(){
  const data = {
    elements: elements.map(e=>({type:e.type, x:e.x, y:e.y, color:e.color, label:e.label, gid:e.gid, w:e.w, h:e.h, text:e.text, size:e.size})),
    svg: svg.innerHTML,
    stageW: stage.style.width,
    stageH: stage.style.height
  };
  const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='stage_template.json'; a.click();
}

function importTemplate(){
  const input = document.createElement('input'); input.type='file'; input.accept='.json';
  input.onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    const data = JSON.parse(await file.text());
    clearAll(true);
    if(data.stageW) stage.style.width = data.stageW;
    if(data.stageH) stage.style.height = data.stageH;
    data.elements.forEach(en => addElem(en.type, en.x, en.y, en));
    svg.innerHTML = data.svg || '';
    saveHistory();
  };
  input.click();
}

// --- Undo / Redo ---
function saveHistory(){
  const state = {
    elements: elements.map(e=>({...e, dom:null})), // Clone without DOM
    svg: svg.innerHTML
  };
  history = history.slice(0, historyIndex + 1);
  history.push(JSON.stringify(state));
  if(history.length > 20) history.shift();
  else historyIndex++;
  updateHistoryButtons();
}

function undo(){
  if(historyIndex > 0){
    historyIndex--;
    applyHistoryState();
  }
}

function redo(){
  if(historyIndex < history.length - 1){
    historyIndex++;
    applyHistoryState();
  }
}

function applyHistoryState(){
  const state = JSON.parse(history[historyIndex]);
  elements.forEach(e=>e.dom.remove());
  elements = [];
  state.elements.forEach(en => addElem(en.type, en.x, en.y, en));
  svg.innerHTML = state.svg;
  updateHistoryButtons();
}

function updateHistoryButtons(){
  document.getElementById('undo-btn').disabled = historyIndex <= 0;
  document.getElementById('redo-btn').disabled = historyIndex >= history.length - 1;
}

// --- Utilities ---
function zoom(v){ zoomLevel=Math.max(0.2,Math.min(3,zoomLevel+v)); applyZoom(); }
function fitZoom(){ const w=document.getElementById('canvas-wrap').clientWidth-40; zoomLevel=Math.min(1.0, w/stage.offsetWidth); applyZoom(); }
function applyZoom(){ zoomCont.style.transform=`scale(${zoomLevel})`; }
function setChairSize(v){ chairSize=v; document.getElementById('chairVal').textContent=v; }
function clearSVG(cls){ svg.querySelectorAll('.'+cls).forEach(e=>e.remove()); }
function drawLine(p1,p2,cls,dash=false){
  const l=document.createElementNS('http://www.w3.org/2000/svg','line');
  l.setAttribute('x1',p1.x); l.setAttribute('y1',p1.y); l.setAttribute('x2',p2.x); l.setAttribute('y2',p2.y);
  l.setAttribute('stroke','#1d9e75'); if(dash) l.setAttribute('stroke-dasharray','4,4');
  l.classList.add(cls); svg.appendChild(l);
}

async function loadPDF(){
  const input=document.createElement('input'); input.type='file'; input.accept='.pdf';
  input.onchange=async e=>{
    const f=e.target.files[0]; if(!f) return;
    const data=new Uint8Array(await f.arrayBuffer());
    const pdf=await pdfjsLib.getDocument({data}).promise;
    const page=await pdf.getPage(1);
    const vp=page.getViewport({scale:1.2}); 
    const cv=document.getElementById('bg');
    cv.width=vp.width; cv.height=vp.height;
    stage.style.width=vp.width+'px'; stage.style.height=vp.height+'px';
    await page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
    cv.style.display='block'; fitZoom();
  };
  input.click();
}

async function exportPNG(){
  const oldZ=zoomLevel; zoomLevel=1.0; applyZoom();
  const canvas=await html2canvas(stage,{backgroundColor:null, scale:2, useCORS:true});
  const link=document.createElement('a'); link.download='stage.png'; link.href=canvas.toDataURL(); link.click();
  zoomLevel=oldZ; applyZoom();
}

function clearAll(silent=false){
  if(silent || confirm('全消去しますか？')){
    elements.forEach(e=>e.dom.remove());
    elements=[]; svg.innerHTML=''; selectElem(null);
    if(!silent) saveHistory();
  }
}

window.onload=init;
</script>
