<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舞台配置図 v14.5</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{
  display:flex;flex-direction:column;height:100vh;
  font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;
  background:#d8d6cf;overflow:hidden;touch-action:none;
}

/* ── Toolbar ── */
#toolbar{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  padding:5px 10px;background:white;border-bottom:1px solid #ddd;
  min-height:42px;
}
button{
  padding:4px 10px;font-size:11px;border:1px solid #ccc;
  border-radius:5px;background:white;cursor:pointer;
}
button.active{background:#e1f5ee;border-color:#1d9e75;color:#0f6e56;font-weight:600;}

.tb-sep{width:1px;height:22px;background:#ddd;}

/* ── Layout ── */
#main{display:flex;flex:1;overflow:hidden;}

#sidebar{
  width:160px;background:white;border-right:1px solid #ddd;
  display:flex;flex-direction:column;
}

#canvas-wrap{
  flex:1;overflow:auto;background:#d8d6cf;position:relative;
}

#zoom-container{
  transform-origin:top left;
  position:absolute;top:20px;left:20px;
}

/* ── Stage ── */
#stage{
  position:relative;background:white;
  border:1px solid #aaa;
  box-shadow:0 2px 16px rgba(0,0,0,.18);
  overflow:hidden;
}

#bg{
  position:absolute;inset:0;width:100%;height:100%;
  pointer-events:none;opacity:.5;display:none;
}

.stage-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(#00000010 1px,transparent 1px),
  linear-gradient(90deg,#00000010 1px,transparent 1px);
  background-size:30px 30px;
}

#svg-layer{position:absolute;inset:0;pointer-events:none;}

/* ── Elements ── */
.elem{position:absolute;user-select:none;touch-action:none;}
.chair{
  border-radius:50%;border:2px solid;background:white;
  display:flex;align-items:center;justify-content:center;
  font-weight:600;
}
.chair-text{pointer-events:none;}

.label-elem{
  font-size:11px;background:white;padding:2px 6px;
  border:1px solid #aaa;border-radius:3px;
}

.rect-elem{
  border:2px solid #555;background:rgba(200,200,200,.1);
}

/* resize handles */
.handle{
  position:absolute;width:12px;height:12px;
  background:#1d9e75;border-radius:50%;
  display:none;
}
.elem.selected .handle{display:block;}
.handle.nw{top:-6px;left:-6px;cursor:nwse-resize;}
.handle.ne{top:-6px;right:-6px;}
.handle.sw{bottom:-6px;left:-6px;}
.handle.se{bottom:-6px;right:-6px;}

/* group */
.grouped{outline:1px dashed #888;}
.selected{outline:2px solid #1d9e75;}
</style>
</head>

<body>

<div id="toolbar">
  <button id="btn-select" class="active" onclick="setTool('select')">選択</button>
  <button onclick="setTool('chair')">椅子</button>
  <button onclick="setTool('arc')">弧</button>
  <button onclick="setTool('line')">棒</button>
  <button onclick="setTool('rect')">矩形</button>
  <button onclick="exportPNG()">PNG</button>
</div>

<div id="main">
<div id="sidebar"></div>

<div id="canvas-wrap">
<div id="zoom-container">
<div id="stage">
<canvas id="bg"></canvas>
<div class="stage-grid"></div>
<svg id="svg-layer"></svg>
</div>
</div>
</div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ───────────────────────── State ───────────────────────── */
let tool="select";
let elements=[];
let selected=null;
let id=0;

let stageW=960,stageH=760;
let zoom=1;

let arc=[],line=[];
let arcState=0,lineState=0;

const stage=document.getElementById("stage");
const zoomC=document.getElementById("zoom-container");
const svg=document.getElementById("svg-layer");

/* ───────────────────────── Init ───────────────────────── */
stage.style.width=stageW+"px";
stage.style.height=stageH+"px";

/* ───────────────────────── Tool ───────────────────────── */
function setTool(t){
  tool=t;
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
  arc=[];line=[];arcState=0;lineState=0;
}

/* ───────────────────────── Add Element ───────────────────────── */
function add(type,x,y,opt={}){
  const el=document.createElement("div");
  el.className="elem";
  el.style.left=x+"px";
  el.style.top=y+"px";
  el.dataset.id=++id;

  const c={
    chair(){
      const size=opt.size||26;
      el.style.width=size+"px";
      el.style.height=size+"px";

      const d=document.createElement("div");
      d.className="chair";
      d.style.width=size+"px";
      d.style.height=size+"px";
      d.style.borderColor=opt.color||"#333";
      d.innerText=opt.label||"Inst";
      el.appendChild(d);
    },
    rect(){
      el.classList.add("rect-elem");
      el.style.width=(opt.w||100)+"px";
      el.style.height=(opt.h||60)+"px";

      ["nw","ne","sw","se"].forEach(p=>{
        const h=document.createElement("div");
        h.className="handle "+p;
        el.appendChild(h);
      });
    },
    label(){
      el.classList.add("label-elem");
      el.innerText=opt.text||"label";
    }
  };

  c[type]();

  el.onmousedown=(e)=>{
    if(tool!=="select")return;
    select(el);
    drag(el,e);
  };

  stage.appendChild(el);
  elements.push({el,type,x,y,opt});
}

/* ───────────────────────── Select ───────────────────────── */
function select(el){
  document.querySelectorAll(".elem").forEach(e=>e.classList.remove("selected"));
  el.classList.add("selected");
  selected=el;
}

/* ───────────────────────── Drag ───────────────────────── */
function drag(el,e){
  const rect=stage.getBoundingClientRect();
  const ox=e.clientX-rect.left-el.offsetLeft;
  const oy=e.clientY-rect.top-el.offsetTop;

  function mv(ev){
    el.style.left=(ev.clientX-rect.left-ox)+"px";
    el.style.top=(ev.clientY-rect.top-oy)+"px";
  }

  document.onmousemove=mv;
  document.onmouseup=()=>document.onmousemove=null;
}

/* ───────────────────────── Stage click ───────────────────────── */
stage.addEventListener("mousedown",e=>{
  if(e.target!==stage)return;

  const r=stage.getBoundingClientRect();
  const x=(e.clientX-r.left)/zoom;
  const y=(e.clientY-r.top)/zoom;

  if(tool==="chair") add("chair",x,y);
  if(tool==="rect") add("rect",x,y);
  if(tool==="label") add("label",x,y,{text:"text"});
  if(tool==="arc") arcTool(x,y);
  if(tool==="line") lineTool(x,y);
});

/* ───────────────────────── Arc ───────────────────────── */
function arcTool(x,y){
  arc.push({x,y});
  arcState++;

  if(arcState===3){
    const n=4;
    for(let i=0;i<n;i++){
      add("chair",arc[0].x+i*20,arc[0].y+i*10);
    }
    arc=[];arcState=0;
  }
}

/* ───────────────────────── Line ───────────────────────── */
function lineTool(x,y){
  line.push({x,y});
  lineState++;

  if(lineState===2){
    const n=4;
    for(let i=0;i<n;i++){
      add("chair",line[0].x+i*20,line[0].y);
    }
    line=[];lineState=0;
  }
}

/* ───────────────────────── PNG EXPORT FIX ───────────────────────── */
function exportPNG(){
  const target=document.getElementById("zoom-container");

  html2canvas(target,{
    scale:3,
    useCORS:true,
    backgroundColor:"#fff",
    scrollX:0,
    scrollY:0
  }).then(canvas=>{
    const a=document.createElement("a");
    a.download="stage_v15.png";
    a.href=canvas.toDataURL("image/png");
    a.click();
  });
}

/* ───────────────────────── Zoom ───────────────────────── */
document.getElementById("canvas-wrap").addEventListener("wheel",e=>{
  if(!e.ctrlKey)return;
  e.preventDefault();
  zoom+=e.deltaY<0?0.1:-0.1;
  zoom=Math.max(0.2,Math.min(3,zoom));
  zoomC.style.transform=`scale(${zoom})`;
},{passive:false});

</script>
</body>
</html>
