<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Stage Planner v15 Skeleton</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
  background:#ddd;
}

#canvasWrap{
  position:relative;
  width:100vw;
  height:100vh;
}

/* Canvas (PDF / BG) */
#bgCanvas{
  position:absolute;
  top:0;left:0;
  z-index:0;
}

/* SVG Layer (Arc / Line / Dim) */
#svgLayer{
  position:absolute;
  top:0;left:0;
  z-index:1;
  pointer-events:none;
}

/* DOM Layer (Objects) */
#domLayer{
  position:absolute;
  top:0;left:0;
  z-index:2;
}

/* Element base */
.elem{
  position:absolute;
  user-select:none;
  touch-action:none;
}

.chair{
  border-radius:50%;
  border:2px solid #333;
  display:flex;
  align-items:center;
  justify-content:center;
  background:white;
  font-size:10px;
}

.rect{
  border:2px solid #666;
  background:rgba(200,200,200,0.1);
}

.selected{
  outline:2px solid #00a86b;
}
</style>
</head>

<body>

<div id="canvasWrap">
  <canvas id="bgCanvas"></canvas>
  <svg id="svgLayer"></svg>
  <div id="domLayer"></div>
</div>

<script>
/* =====================================================
   ■ v15 ARCHITECTURE CORE
===================================================== */

/* --------------------------
   ■ Scene Graph
-------------------------- */
const Scene = {
  elements: new Map(),
  groups: new Map(),
  bg: null
};

/* --------------------------
   ■ Controller
-------------------------- */
const Controller = {
  tool: "select",
  selected: new Set(),
  drag: null,

  setTool(t){
    this.tool = t;
  },

  select(id, multi=false){
    if(!multi) this.selected.clear();
    this.selected.add(id);
    Renderer.updateSelection();
  },

  clearSelection(){
    this.selected.clear();
    Renderer.updateSelection();
  }
};

/* --------------------------
   ■ Renderer
-------------------------- */
const Renderer = {

  domLayer: document.getElementById("domLayer"),
  svgLayer: document.getElementById("svgLayer"),

  /* Element render */
  renderElement(el){
    let node;

    if(el.type === "chair"){
      node = document.createElement("div");
      node.className = "elem chair";
      node.textContent = el.text || "";
      node.style.width = el.size + "px";
      node.style.height = el.size + "px";
      node.style.borderColor = el.color;
      node.style.left = el.x + "px";
      node.style.top = el.y + "px";
    }

    if(el.type === "rect"){
      node = document.createElement("div");
      node.className = "elem rect";
      node.style.width = el.w + "px";
      node.style.height = el.h + "px";
      node.style.left = el.x + "px";
      node.style.top = el.y + "px";

      const txt = document.createElement("div");
      txt.style.position = "absolute";
      txt.style.top = "50%";
      txt.style.left = "50%";
      txt.style.transform = "translate(-50%,-50%)";
      txt.textContent = el.text || "";
      node.appendChild(txt);
    }

    node.dataset.id = el.id;

    node.addEventListener("pointerdown", (e)=>{
      e.stopPropagation();
      if(e.shiftKey){
        Controller.select(el.id,true);
      }else{
        Controller.select(el.id,false);
      }
    });

    this.domLayer.appendChild(node);
    el.node = node;
  },

  rerender(){
    this.domLayer.innerHTML = "";
    Scene.elements.forEach(el => this.renderElement(el));
  },

  updateSelection(){
    Scene.elements.forEach(el=>{
      if(el.node){
        if(Controller.selected.has(el.id)){
          el.node.classList.add("selected");
        }else{
          el.node.classList.remove("selected");
        }
      }
    });
  }
};

/* --------------------------
   ■ Factory
-------------------------- */
const Factory = {

  id:0,

  chair(x,y){
    return {
      id:++this.id,
      type:"chair",
      x,y,
      size:30,
      color:"#333",
      text:"Inst"
    };
  },

  rect(x,y){
    return {
      id:++this.id,
      type:"rect",
      x,y,
      w:120,
      h:60,
      text:"Section"
    };
  }
};

/* --------------------------
   ■ Input System
-------------------------- */
const Input = {
  init(){
    const wrap = document.getElementById("canvasWrap");

    wrap.addEventListener("pointerdown",(e)=>{
      const x = e.clientX;
      const y = e.clientY;

      if(Controller.tool === "chair"){
        const el = Factory.chair(x,y);
        Scene.elements.set(el.id,el);
        Renderer.renderElement(el);
      }

      if(Controller.tool === "rect"){
        const el = Factory.rect(x,y);
        Scene.elements.set(el.id,el);
        Renderer.renderElement(el);
      }

      if(Controller.tool === "select"){
        Controller.clearSelection();
      }
    });
  }
};

/* --------------------------
   ■ Export (Skeleton)
-------------------------- */
const Exporter = {

  png(){
    // v15では「Scene再描画ベース」で実装予定
    alert("PNG export skeleton (to be implemented with full renderer sync)");
  }
};

/* --------------------------
   ■ Init
-------------------------- */
function init(){
  Input.init();

  // sample
  const c1 = Factory.chair(100,100);
  Scene.elements.set(c1.id,c1);

  const r1 = Factory.rect(200,200);
  Scene.elements.set(r1.id,r1);

  Renderer.rerender();
}

init();

</script>

</body>
</html>
