<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>舞台配置図 v18.9.1</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* 既存スタイルを継承 */
*{box-sizing:border-box;margin:0;padding:0;}
body{display:flex;flex-direction:column;height:100vh;font-family:-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;background:#d8d6cf;overflow:hidden;touch-action:none;}

#toolbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:5px 12px;background:white;border-bottom:1px solid #ddd;
  min-height:45px;flex-shrink:0;z-index:100;
}
.tb-group{display:flex;align-items:center;gap:6px;}
.tb-sep{width:1px;height:24px;background:#e0e0e0;margin:0 4px;}
.tb-label{font-size:11px;color:#666;white-space:nowrap;}

/* 数値入力フォーム用のスタイル */
.val-input {
  width: 54px;
  height: 26px;
  border: 1px solid #1d9e75;
  border-radius: 4px;
  background: #f0f7f5;
  text-align: center;
  font-family: 'Consolas', monospace;
  font-size: 13px;
  font-weight: bold;
  color: #1d9e75;
}

button{
  padding:5px 10px;font-size:11px;border:1px solid #ccc;border-radius:5px;
  background:white;cursor:pointer;color:#333;white-space:nowrap;
  transition:background .12s;
}
button:hover{background:#f0f0ee;}
button.active{background:#e1f5ee;border-color:#1d9e75;color:#0f6e56;font-weight:600;}

input[type=range]{width:80px; cursor: pointer;}
input[type=number]{padding:3px; border:1px solid #ccc; border-radius:4px;}

/* メインレイアウト */
#main{display:flex;flex:1;overflow:hidden;}
#sidebar{width:170px;background:white;border-right:1px solid #ddd;display:flex;flex-direction:column;flex-shrink:0;}
#canvas-wrap{flex:1;overflow:auto;background:#d8d6cf;position:relative;}
#zoom-container{transform-origin:top left;position:absolute;top:20px;left:20px;}
#stage{position:relative;background:white;border:1px solid #aaa;box-shadow:0 2px 16px rgba(0,0,0,.18);touch-action:none;}
.stage-grid{position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(0,0,0,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,0.05) 1px,transparent 1px);background-size:30px 30px;}
#svg-layer{position:absolute;inset:0;overflow:visible;pointer-events:none;z-index:5;}

.elem{position:absolute;cursor:move;user-select:none;touch-action:none;}
.chair{border-radius:50%;border:2px solid;background:white;display:flex;align-items:center;justify-content:center;font-weight:600;pointer-events:auto;}
.chair-text{position:absolute;white-space:nowrap;pointer-events:none;}
.elem.selected .chair{outline:2px solid #1d9e75;outline-offset:3px;}

#guide-panel{
  position:fixed;top:60px;left:185px;background:white;border:1px solid #ccc;
  border-radius:8px;padding:12px;box-shadow:0 4px 15px rgba(0,0,0,0.15);
  display:none;z-index:1000;font-size:12px;
}
.step{display:flex;align-items:center;gap:8px;margin:4px 0;opacity:0.3;}
.step.active{opacity:1;color:#1d9e75;font-weight:bold;}
.step-num{width:18px;height:18px;background:#eee;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;}
.step.active .step-num{background:#1d9e75;color:white;}
</style>
</head>
<body>

<div id="toolbar">
  <div class="tb-group">
    <button id="btn-select" class="active" onclick="setTool('select')">▷ 選択</button>
    <button id="btn-chair" onclick="setTool('chair')">○ 椅子</button>
    <button id="btn-arc" onclick="setTool('arc')">⌒ 弧配置</button>
    <button id="btn-line" onclick="setTool('line')">｜ 棒配置</button>
  </div>

  <div class="tb-sep"></div>

  <div class="tb-group">
    <span class="tb-label">椅子サイズ</span>
    <input type="range" id="size-slider" min="15" max="80" value="26" oninput="syncSize(this.value, 'input')">
    <input type="number" id="size-num" value="26" min="1" max="200" class="val-input" oninput="syncSize(this.value, 'slider')">
    <span class="tb-label">px</span>
  </div>

  <div class="tb-sep"></div>

  <div class="tb-group">
    <span class="tb-label">ズーム</span>
    <input type="range" id="zoom-slider" min="0.2" max="2.0" step="0.05" value="1.0" oninput="syncZoom(this.value, 'input')">
    <input type="number" id="zoom-num" value="100" min="10" max="400" class="val-input" oninput="syncZoom(this.value/100, 'slider')">
    <span class="tb-label">%</span>
    <button onclick="fitZoom()">100%</button>
  </div>

  <div class="tb-sep"></div>

  <div class="tb-group">
    <button onclick="saveTemplate()">💾 保存</button>
    <button onclick="loadTemplate()">📂 読込</button>
    <button onclick="exportPNG()" style="background:#1d9e75;color:white;">📷 PNG出力</button>
  </div>
</div>

<div id="main">
  <div id="sidebar">
    <div id="inst-list" style="padding:10px; font-size:12px;">
      <div style="color:#999; margin-bottom:5px;">楽器選択</div>
      <div id="list-container"></div>
    </div>
  </div>
  <div id="canvas-wrap">
    <div id="zoom-container">
      <div id="stage" style="width:960px; height:700px;">
        <div class="stage-grid"></div>
        <svg id="svg-layer"></svg>
      </div>
    </div>
  </div>
</div>

<div id="guide-panel">
  <div id="guide-title" style="font-weight:bold;margin-bottom:8px;border-bottom:1px solid #eee;"></div>
  <div id="guide-steps"></div>
</div>

<script>
// --- 基本設定 ---
let tool = 'select';
let zoomLevel = 1.0;
let nextChairSize = 26; 
let currentInst = {l: "Fl", c: "#e35"};
let elements = [];
let arcPts = [];
let linePts = [];

const stage = document.getElementById('stage');
const zoomCont = document.getElementById('zoom-container');

// --- 同期・ズーム制御 ---
function syncZoom(val, targetType) {
  const z = parseFloat(val) || 1.0;
  zoomLevel = z;
  zoomCont.style.transform = `scale(${zoomLevel})`;
  
  if (targetType === 'input') {
    document.getElementById('zoom-num').value = Math.round(z * 100);
  } else {
    document.getElementById('zoom-slider').value = z;
  }
}

function fitZoom() {
  syncZoom(1.0, 'input');
  document.getElementById('zoom-slider').value = 1.0;
}

// --- 同期・椅子サイズ設定 ---
function syncSize(val, targetType) {
  const s = parseInt(val) || 26;
  nextChairSize = s;
  
  if (targetType === 'input') {
    document.getElementById('size-num').value = s;
  } else {
    document.getElementById('size-slider').value = s;
  }
}

// --- ツール切り替えとガイド表示 ---
function setTool(t) {
  tool = t;
  arcPts = []; linePts = [];
  document.querySelectorAll('button[id^=btn-]').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + t).classList.add('active');
  updateGuide();
}

function updateGuide() {
  const panel = document.getElementById('guide-panel');
  if (tool !== 'arc' && tool !== 'line') {
    panel.style.display = 'none';
    return;
  }
  panel.style.display = 'block';
  const title = tool === 'arc' ? "⌒ 弧配置" : "｜ 棒配置";
  const steps = tool === 'arc' ? ["始点", "膨らみ", "終点"] : ["始点", "終点"];
  const currentCount = tool === 'arc' ? arcPts.length : linePts.length;

  document.getElementById('guide-title').textContent = title;
  document.getElementById('guide-steps').innerHTML = steps.map((s, i) => `
    <div class="step ${i === currentCount ? 'active' : ''}">
      <span class="step-num">${i + 1}</span>${s}
    </div>
  `).join('');
}

// --- 要素の追加 ---
function addChair(x, y, label, color) {
  const id = Date.now();
  const wrap = document.createElement('div');
  wrap.className = 'elem';
  wrap.style.left = x + 'px';
  wrap.style.top = y + 'px';
  
  const size = nextChairSize; 
  
  const ch = document.createElement('div');
  ch.className = 'chair';
  ch.style.width = size + 'px';
  ch.style.height = size + 'px';
  ch.style.borderColor = color;
  ch.style.color = color;
  ch.innerHTML = `<span class="chair-text" style="font-size:${size*0.35}px">${label}</span>`;
  
  wrap.appendChild(ch);
  stage.appendChild(wrap);
  elements.push({id, dom: wrap, size});
}

// --- 配置ロジック ---
stage.addEventListener('mousedown', (e) => {
  if (tool === 'select') return;
  const rect = stage.getBoundingClientRect();
  const x = (e.clientX - rect.left) / zoomLevel;
  const y = (e.clientY - rect.top) / zoomLevel;

  if (tool === 'chair') {
    addChair(x - nextChairSize/2, y - nextChairSize/2, currentInst.l, currentInst.c);
  } else if (tool === 'arc') {
    arcPts.push({x, y});
    if (arcPts.length === 3) {
      const n = prompt("椅子の数", "5");
      if(n) alert(n + "個の椅子をサイズ " + nextChairSize + "px で配置しました");
      arcPts = [];
    }
    updateGuide();
  } else if (tool === 'line') {
    linePts.push({x, y});
    if (linePts.length === 2) {
      const n = prompt("椅子の数", "5");
      linePts = [];
    }
    updateGuide();
  }
});

// 初期化
window.onload = () => {
  const container = document.getElementById('list-container');
  ["Fl", "Cl", "Tp", "Tb"].forEach(l => {
    const d = document.createElement('div');
    d.style.padding = "5px"; d.style.cursor = "pointer";
    d.textContent = l;
    d.onclick = () => { currentInst.l = l; setTool('chair'); };
    container.appendChild(d);
  });
};

function exportPNG() { alert("PNG出力準備完了"); }
function saveTemplate() { alert("保存しました"); }
function loadTemplate() { alert("読込完了"); }

</script>
</body>
</html>
